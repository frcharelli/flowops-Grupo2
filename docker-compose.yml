version: '3.8'

services:

  # ─── MongoDB ────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: tpo-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

  # ─── Neo4j ─────────────────────────────────
  neo4j:
    image: neo4j:5.18.0-community
    container_name: tpo-neo4j
    restart: always
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

  # ─── Redis ─────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: tpo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Cassandra ─────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: tpo-cassandra
    restart: always
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: TPO_Cluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  mongo_data:
  neo4j_data:
  redis_data:
  cassandra_data: